name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The release gate (release-gate.yml) must have passed on the commit the tag
  # points to, in a run started by hand on main (docs/releasing.md): a pull
  # request's run uses that pull request's copy of the gate. Checked here, so
  # a tag pushed too early, or on another commit, publishes nothing.
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: The release gate passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          sha=$(gh api "repos/$REPO/commits/refs/tags/$TAG" --jq .sha)
          passed=$(gh api "repos/$REPO/actions/workflows/release-gate.yml/runs?head_sha=$sha&event=workflow_dispatch&branch=main&status=success&per_page=100" \
            --jq "[.workflow_runs[] | select(.head_sha == \"$sha\" and .event == \"workflow_dispatch\" and .head_branch == \"main\" and .conclusion == \"success\")] | length")
          if [ "$passed" -eq 0 ]; then
            echo "::error::The release gate has not passed on $sha, the commit of $TAG."
            echo "Run Actions > Release gate > Run workflow on main at that commit, wait"
            echo "for it to be green, then re-run this workflow. Nothing was published."
            exit 1
          fi
          echo "release gate passed on $sha ($passed green run(s) on main)"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy src
      # coverage run (not --cov) so the module-level lines of the entry-point plugin count
      - run: uv run --no-sync coverage run -m pytest
      - run: uv run --no-sync coverage report

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - run: uv build
      - name: Check that the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          wheel="dist/pytest_queryguard-${version}-py3-none-any.whl"
          sdist="dist/pytest_queryguard-${version}.tar.gz"
          if [ ! -f "$wheel" ] || [ ! -f "$sdist" ]; then
            echo "Tag $TAG does not match the built package:"
            ls dist
            exit 1
          fi
      # The release gate checked a build of its own; these are the files that
      # get published. The script needs only the standard library.
      - name: Wheel and sdist contain what they should and nothing else
        run: uv run --no-project python scripts/release_gate.py contents dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: [gate, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
