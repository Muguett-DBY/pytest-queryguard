name: CI

on:
  push:
    branches: [main]
  pull_request:
  # called by release-gate.yml, so a release runs the whole matrix below
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels the run for its previous head. Pushes
# to main share one group: the running run finishes and only the newest
# waiting run is kept, since it tests every earlier merge as well. The release
# gate calls this workflow under its own name, so it is never in these groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy src

  # The documentation site (scripts/build_docs.py) must build without broken
  # links or pages missing from docs/site.toml. Building only: nothing is
  # published from here.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync --only-group docs
      - run: uv run --no-sync python scripts/build_docs.py --strict

  # Python 3.15 is a pre-release; setup-uv installs it like the others (uv
  # downloads pre-release interpreters when the version is named explicitly).
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        sqlalchemy: ["2.0", "latest"]
        pytest: ["latest"]
        include:
          # the oldest supported pytest
          - python-version: "3.10"
            sqlalchemy: "2.0"
            pytest: "8.0"
          # the last SQLAlchemy that leaks the outer statement's load options
          # (yield_per, autoflush) into selectinload when a do_orm_execute
          # listener exists (fixed in 2.0.50); see tests/test_yield_per_leak.py
          - python-version: "3.12"
            sqlalchemy: "2.0.49"
            pytest: "latest"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - name: Pin SQLAlchemy to the 2.0 series
        if: matrix.sqlalchemy == '2.0'
        # SQLModel requires SQLAlchemy below 2.1, so it is not in uv.lock; the
        # corpus scenarios that use it run only here.
        run: uv pip install "sqlalchemy==2.0.*" sqlmodel
      - name: Pin SQLAlchemy to 2.0.49
        if: matrix.sqlalchemy == '2.0.49'
        run: uv pip install "sqlalchemy==2.0.49" sqlmodel
      - name: Pin pytest to the oldest supported series
        if: matrix.pytest == '8.0'
        run: uv pip install "pytest==8.0.*"
      # coverage run (not --cov) so the module-level lines of the entry-point plugin count
      - run: uv run --no-sync coverage run -m pytest
      - run: uv run --no-sync coverage report

  # Free-threaded Python 3.14 starts threads with the creator's context
  # (sys.flags.thread_inherit_context), which changes how the in-app mode
  # attributes statements from threads. tests/inapp checks both behaviors.
  free-threaded:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14t"
      - run: uv sync
      - run: uv run --no-sync python -c "import sys; assert sys.flags.thread_inherit_context"
      - run: uv run --no-sync pytest tests/inapp

  # Real pytest-xdist runs: tests/test_xdist.py starts pytest with -n 2 and
  # -n 4 in subprocesses; the whole suite then runs once more under -n 2,
  # with the plugin measuring its own tests across workers.
  xdist:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - run: uv run --no-sync pytest tests/test_xdist.py -v
      # 500 generated tests on 4 workers: baseline, SARIF, no leakage
      - run: uv run --no-sync pytest tests/test_stress_xdist.py tests/test_stress_memory.py -v
        env:
          QUERYGUARD_STRESS: "1"
      - run: uv run --no-sync pytest -n 2 --ignore=tests/test_xdist.py

  # Third-party plugins that change how every test runs (the "plugins"
  # dependency group: pytest-randomly, pytest-asyncio). Only the tests written
  # for them run here; installed, they would reorder the whole suite. The
  # documentation projects run here too, so that the pytest-asyncio recipe,
  # which the other jobs skip, is run in CI.
  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync --group plugins
      - run: >-
          uv run --no-sync pytest -v -p no:randomly
          -o asyncio_default_fixture_loop_scope=function
          tests/test_plugin_interplay.py tests/test_concurrency.py
          tests/test_doc_examples.py

  # Per-statement overhead of the measurement against the stored baseline in
  # scripts/bench_baseline.json (relative overhead, generous margin). Linux
  # and one Python version only: timing on several runners is just noise.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run --no-sync python scripts/bench_gate.py

  # The SQLite-only suite on the other operating systems (paths, temp dirs,
  # newline handling, file locking). PostgreSQL tests skip without a server.
  os:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - run: uv run --no-sync pytest -rs

  # The missing-index check needs a real server. 14 and 15 cover the "too old"
  # notice; 16, 17 and 18 run the check itself. Each run exercises two
  # drivers: the sync driver of QUERYGUARD_PG_URL (pg8000) and asyncpg
  # (tests/test_index_check_async.py). One more run on 16 uses the oldest
  # supported SQLAlchemy, which the asyncpg path depends on (run_async() on
  # adapted connections).
  #
  # One run on 17 uses psycopg 3, the most common PostgreSQL driver: the whole
  # suite with psycopg as the sync driver, and its async mode in
  # tests/test_psycopg_async.py. psycopg is LGPL-licensed, so it is not a
  # dependency of the package or of the dev group (not in uv.lock); it is
  # installed only here, as a CI-only test dependency, and nothing of it is
  # shipped.
  #
  # The index advisor verifies its suggestions with the hypopg extension. The
  # official postgres image is Debian-based with the PGDG repository, which has
  # postgresql-<major>-hypopg for 14 to 18, so the server is that image plus
  # the package, started with docker run (a service container cannot install
  # packages). Where the package does not exist the plain image is used, the
  # extension is not created and the tests that need it are skipped.
  postgres:
    # The pg8000 runs keep the names they had before the driver was added to
    # the matrix, so required checks that name them still match.
    name: postgres (${{ matrix.postgres }}, ${{ matrix.sqlalchemy }}${{ matrix.driver != 'pg8000' && format(', {0}', matrix.driver) || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["14", "15", "16", "17", "18"]
        sqlalchemy: ["latest"]
        driver: ["pg8000"]
        include:
          - postgres: "16"
            sqlalchemy: "2.0"
            driver: "pg8000"
          - postgres: "17"
            sqlalchemy: "latest"
            driver: "psycopg"
    env:
      QUERYGUARD_PG_URL: postgresql+${{ matrix.driver }}://postgres:pg@localhost:5432/postgres
    steps:
      - name: Start PostgreSQL ${{ matrix.postgres }} with hypopg
        env:
          MAJOR: ${{ matrix.postgres }}
        run: |
          image="postgres:${MAJOR}"
          if printf 'FROM postgres:%s\nRUN apt-get update && apt-get install -y --no-install-recommends postgresql-%s-hypopg && rm -rf /var/lib/apt/lists/*\n' "$MAJOR" "$MAJOR" | docker build -t qg-postgres -; then
            image=qg-postgres
          else
            echo "::warning::no hypopg package for PostgreSQL ${MAJOR}; its tests will be skipped"
          fi
          docker run -d --name qg-postgres-server -p 5432:5432 -e POSTGRES_PASSWORD=pg "$image"
          for _ in $(seq 1 60); do
            docker exec qg-postgres-server pg_isready -h localhost -U postgres && break
            sleep 1
          done
          docker exec qg-postgres-server pg_isready -h localhost -U postgres
          # created in the test database, so the whole suite runs the advisor with hypopg
          docker exec qg-postgres-server psql -U postgres -c "CREATE EXTENSION IF NOT EXISTS hypopg" || true
          docker exec qg-postgres-server psql -U postgres -Atc "SELECT version(); SELECT coalesce((SELECT extversion FROM pg_extension WHERE extname = 'hypopg'), 'hypopg not installed')"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Pin SQLAlchemy to the 2.0 series
        if: matrix.sqlalchemy == '2.0'
        run: uv pip install "sqlalchemy==2.0.*"
      - name: Install psycopg 3 (CI only, not in uv.lock)
        if: matrix.driver == 'psycopg'
        run: uv pip install "psycopg[binary]==3.3.6"
      - run: uv run --no-sync coverage run -m pytest -rs
      - run: uv run --no-sync coverage report

  # The missing-index check on MySQL and MariaDB (docs/index-check-mysql.md):
  # the LTS releases MySQL 8.4 and MariaDB 11.8, with PyMySQL and aiomysql
  # from the dev group. The images are pinned to a patch release: the live
  # tests compare exact plans, and a new release may plan a case differently,
  # which should show up in a pull request that moves the pin, not at random. Only the MySQL test files run; the rest of the suite
  # does not touch these servers. QUERYGUARD_REQUIRE_BACKENDS makes the live
  # tests fail instead of skipping when the driver is missing or the server is
  # not reachable, so the job cannot pass without having run them.
  #
  # Both servers are GPL-licensed. They run here only as the official Docker
  # images, as test services: nothing of them is a dependency or shipped.
  # The server is started with docker run, like the postgres job, because a
  # service container takes no server options: MySQL 8.4 needs
  # mysql_native_password, since PyMySQL needs the cryptography package (not
  # installed here) for caching_sha2_password over a plain connection.
  mysql:
    name: mysql (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: mysql
            image: mysql:8.4.13
            client: mysql
            options: --mysql-native-password=ON --authentication-policy=mysql_native_password
          - kind: mariadb
            image: mariadb:11.8.9
            client: mariadb
            options: ""
    env:
      QUERYGUARD_REQUIRE_BACKENDS: ${{ matrix.kind }}
      QUERYGUARD_MYSQL_URL: ${{ matrix.kind == 'mysql' && 'mysql+pymysql://root:secret@127.0.0.1:3306/mysql' || '' }}
      QUERYGUARD_MARIADB_URL: ${{ matrix.kind == 'mariadb' && 'mysql+pymysql://root:secret@127.0.0.1:3306/mysql' || '' }}
    steps:
      - name: Start ${{ matrix.image }}
        env:
          IMAGE: ${{ matrix.image }}
          CLIENT: ${{ matrix.client }}
          OPTIONS: ${{ matrix.options }}
        run: |
          # OPTIONS is split into words on purpose
          # shellcheck disable=SC2086
          docker run -d --name qg-mysql-server -p 127.0.0.1:3306:3306 \
            -e MYSQL_ROOT_PASSWORD=secret -e MARIADB_ROOT_PASSWORD=secret \
            "$IMAGE" $OPTIONS
          # Over TCP, so the temporary server of the image's first start (no
          # networking) does not count as ready.
          for _ in $(seq 1 90); do
            docker exec qg-mysql-server "$CLIENT" -h127.0.0.1 -uroot -psecret -e "SELECT 1" >/dev/null 2>&1 && break
            sleep 1
          done
          if ! docker exec qg-mysql-server "$CLIENT" -h127.0.0.1 -uroot -psecret -e "SELECT VERSION()"; then
            docker logs qg-mysql-server
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync
      - run: >-
          uv run --no-sync pytest -rs
          tests/test_mysql_index.py tests/test_mysql_index_check.py
          tests/test_mysql_index_parameters.py

  # The GitHub Action in action/ on a tiny sample project (examples/action-sample)
  # with one N+1 query: one run that reports it and does not fail, one that
  # fails, one with the finding in a baseline.
  # The upload step is skipped by the action on pull requests from forks and
  # for Dependabot. No step here uploads: a sample upload with no results
  # makes every pull request say "1 configuration not found" in its checks.
  action:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # the first run compares its query counts with main and comments them
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report the finding, do not fail
        id: report
        uses: ./action
        with:
          python-version: "3.12"
          package: ${{ github.workspace }}
          working-directory: examples/action-sample
          sarif-file: report.sarif
          fail: "false"
          upload: "false"
      - name: Check the SARIF file and the outputs
        env:
          EXIT_CODE: ${{ steps.report.outputs.exit-code }}
          JSON_FILE: ${{ steps.report.outputs.json-file }}
        run: |
          python - <<'PY'
          import json, os

          assert os.environ["EXIT_CODE"] == "1", os.environ["EXIT_CODE"]
          with open(os.path.join("examples/action-sample", os.environ["JSON_FILE"])) as handle:
              counts = json.load(handle)
          assert counts["complete"] is True, counts
          (finding,) = [
              f for entry in counts["tests"].values() for f in entry["findings"]
          ]
          assert finding["kind"] == "relationship-load", finding
          print("JSON ok:", len(counts["tests"]), "tests")
          with open("examples/action-sample/report.sarif") as handle:
              document = json.load(handle)
          (result,) = document["runs"][0]["results"]
          assert result["ruleId"] == "queryguard/relationship-load", result
          location = result["locations"][0]["physicalLocation"]
          # pytest runs in examples/action-sample, but GitHub reads the URI
          # relative to the repository root, so the directory must be in it
          uri = location["artifactLocation"]["uri"]
          assert uri == "examples/action-sample/test_books.py", uri
          assert os.path.isfile(uri), uri
          print("SARIF ok:", result["message"]["text"].splitlines()[0])
          PY
      - name: Fail on the finding
        id: strict
        continue-on-error: true
        uses: ./action
        with:
          package: ${{ github.workspace }}
          working-directory: examples/action-sample
          sarif-file: strict.sarif
          upload: "false"
          compare: "false"
          category: strict  # its own artifact name, the first run's stays
      - name: The step must have failed
        env:
          OUTCOME: ${{ steps.strict.outcome }}
        run: test "$OUTCOME" = "failure"
      - name: Accept the finding with the baseline and upload
        id: baseline
        uses: ./action
        with:
          package: ${{ github.workspace }}
          working-directory: examples/action-sample
          baseline: queryguard-baseline.json
          pytest-args: -v -k "n_plus_one"
          upload: "false"
          compare: "false"
          category: baselined
      - name: The baselined run must be clean
        env:
          EXIT_CODE: ${{ steps.baseline.outputs.exit-code }}
        run: test "$EXIT_CODE" = "0"
