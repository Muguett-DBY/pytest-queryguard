name: pytest-queryguard
description: >-
  Run pytest with pytest-queryguard and upload its findings (N+1 queries,
  repeated statements, missing indexes) to GitHub code scanning as SARIF.
author: MaciejZiel

inputs:
  pytest-args:
    description: >-
      Arguments for pytest, as in a shell: quotes work, for example
      -k "orders or users" tests/.
    required: false
    default: ""
  python-version:
    description: >-
      Python version to set up (for example 3.12). Empty: use the python that
      is already on PATH, for example from your own setup-python step.
    required: false
    default: ""
  package:
    description: >-
      What to pip install for the plugin: a requirement such as
      "pytest-queryguard>=0.4" or a path to a checkout. Empty (the default):
      install the plugin from the checkout of this action, so the plugin
      version is the one the action's own ref ships (the action passes
      --queryguard-sarif, which older plugin versions reject). pytest and
      SQLAlchemy come with it. Your own project and its test dependencies must
      be installed before this action runs.
    required: false
    default: ""
  baseline:
    description: >-
      Path of a baseline file (--queryguard-baseline). Findings in it are
      neither reported nor uploaded. Empty: use queryguard_baseline from your
      pytest configuration, if any.
    required: false
    default: ""
  fail:
    description: >-
      "true": the step fails when pytest fails, as in a normal run. "false":
      the step never fails, findings are only uploaded.
    required: false
    default: "true"
  working-directory:
    description: Directory to run pytest in.
    required: false
    default: "."
  sarif-file:
    description: Where to write the SARIF file, relative to working-directory.
    required: false
    default: queryguard.sarif
  upload:
    description: >-
      "true": upload the SARIF file to code scanning. Skipped on pull requests
      from forks and on runs triggered by Dependabot, where the token is
      read-only. "false": only write the file.
    required: false
    default: "true"
  category:
    description: >-
      Code scanning category; use one per job when several jobs upload. It
      also names the job's query-count artifact and pull-request comment.
    required: false
    default: pytest-queryguard
  json-file:
    description: >-
      Where to write the per-test query counts (--queryguard-json), relative
      to working-directory. The file is uploaded as the artifact
      queryguard-json-<category>, which later runs compare against.
    required: false
    default: queryguard.json
  compare:
    description: >-
      "true": on a pull request, compare the query counts with the latest run
      of this workflow on the base branch and write the result to the job
      summary. Needs the "actions: read" permission. "false": skip.
    required: false
    default: "true"
  comment:
    description: >-
      "true": also post the comparison as a pull-request comment, updated in
      place on later pushes. Needs "pull-requests: write"; skipped on pull
      requests from forks and Dependabot. "false": job summary only.
    required: false
    default: "true"
  github-token:
    description: Token for the comparison and the comment.
    required: false
    default: ${{ github.token }}

outputs:
  exit-code:
    description: Exit code of pytest.
    value: ${{ steps.pytest.outputs.exit-code }}
  sarif-file:
    description: Path of the SARIF file, relative to working-directory.
    value: ${{ inputs.sarif-file }}
  json-file:
    description: Path of the query-count JSON file, relative to working-directory.
    value: ${{ inputs.json-file }}

runs:
  using: composite
  steps:
    - name: Set up Python
      if: inputs.python-version != ''
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install pytest-queryguard
      shell: bash
      env:
        QG_PACKAGE: ${{ inputs.package }}
        QG_ACTION_PATH: ${{ github.action_path }}
      run: |
        # No package given: install the plugin from this action's own checkout
        # (the repository root, one level above action/), so the plugin always
        # matches the ref the workflow pinned and understands --queryguard-sarif.
        if [ -z "$QG_PACKAGE" ]; then
          QG_PACKAGE="$QG_ACTION_PATH/.."
        fi
        python -m pip install --disable-pip-version-check "$QG_PACKAGE"

    - name: Run pytest
      id: pytest
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        QG_ARGS: ${{ inputs.pytest-args }}
        QG_BASELINE: ${{ inputs.baseline }}
        QG_SARIF: ${{ inputs.sarif-file }}
        QG_JSON: ${{ inputs.json-file }}
      run: |
        # The inputs reach the shell as environment variables, never spliced into
        # the script. pytest-args is split into words with Python's shlex; no
        # shell evaluates it, so $(...) and backticks stay literal text.
        extra=()
        if [ -n "$QG_BASELINE" ]; then
          extra+=("--queryguard-baseline=$QG_BASELINE")
        fi
        args=()
        if [ -n "$QG_ARGS" ]; then
          while IFS= read -r -d '' word; do
            args+=("$word")
          done < <(python -c 'import os,shlex,sys; sys.stdout.write("".join(w + "\0" for w in shlex.split(os.environ["QG_ARGS"])))')
        fi
        set +e
        python -m pytest "--queryguard-sarif=$QG_SARIF" "--queryguard-json=$QG_JSON" "${extra[@]}" "${args[@]}"
        code=$?
        set -e
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        if [ ! -f "$QG_SARIF" ]; then
          echo "::warning::pytest did not write $QG_SARIF (exit code $code)"
        fi

    - name: Find the SARIF file
      id: sarif
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        QG_SARIF: ${{ inputs.sarif-file }}
      run: |
        if [ -f "$QG_SARIF" ]; then
          echo "path=$(realpath "$QG_SARIF")" >> "$GITHUB_OUTPUT"
        fi

    - name: Upload SARIF to code scanning
      if: >-
        always() && inputs.upload == 'true' && steps.sarif.outputs.path != ''
        && github.actor != 'dependabot[bot]'
        && !(github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.fork)
      # An upload that is refused (read-only token in a case not listed above)
      # must not fail a job whose tests passed.
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      with:
        sarif_file: ${{ steps.sarif.outputs.path }}
        category: ${{ inputs.category }}

    - name: Find the JSON file
      id: json
      if: always()
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        QG_JSON: ${{ inputs.json-file }}
      run: |
        if [ -f "$QG_JSON" ]; then
          echo "path=$(realpath "$QG_JSON")" >> "$GITHUB_OUTPUT"
        fi

    - name: Upload the query counts
      if: always() && steps.json.outputs.path != ''
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: queryguard-json-${{ inputs.category }}
        path: ${{ steps.json.outputs.path }}
        retention-days: 30
        overwrite: true

    - name: Compare the query counts with the base branch
      id: compare
      if: >-
        always() && inputs.compare == 'true' && steps.json.outputs.path != ''
        && github.event_name == 'pull_request'
      # The comparison is information: it never fails the job.
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        QG_REPO: ${{ github.repository }}
        QG_BASE: ${{ github.event.pull_request.base.ref }}
        QG_WORKFLOW_REF: ${{ github.workflow_ref }}
        QG_CATEGORY: ${{ inputs.category }}
        QG_HEAD_JSON: ${{ steps.json.outputs.path }}
        QG_TMP: ${{ runner.temp }}
      run: |
        # The workflow file of this run, e.g. ci.yml, from
        # owner/repo/.github/workflows/ci.yml@refs/pull/1/merge
        workflow="${QG_WORKFLOW_REF%%@*}"
        workflow="${workflow##*/}"
        dir="$QG_TMP/queryguard-base"
        rm -rf "$dir"
        found=""
        # the latest finished runs of this workflow on the base branch; the
        # artifact is uploaded whether the tests passed or not
        for run in $(gh run list -R "$QG_REPO" --workflow "$workflow" --branch "$QG_BASE" \
            --event push --status completed --limit 10 --json databaseId --jq '.[].databaseId'); do
          if gh run download "$run" -R "$QG_REPO" -n "queryguard-json-$QG_CATEGORY" -D "$dir" 2>/dev/null; then
            found="$run"
            break
          fi
        done
        report="$QG_TMP/queryguard-compare.md"
        if [ -z "$found" ]; then
          {
            echo "### pytest-queryguard: no query counts of the base branch"
            echo
            echo "No run of \`$workflow\` on \`$QG_BASE\` has the artifact queryguard-json-$QG_CATEGORY yet. It appears after this workflow runs on a push to \`$QG_BASE\` with this version of the action."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        base_json="$(find "$dir" -name '*.json' -type f | head -n 1)"
        key=""
        if [ "$QG_CATEGORY" != "pytest-queryguard" ]; then
          key="$QG_CATEGORY"
        fi
        python -m pytest_queryguard.compare "$base_json" "$QG_HEAD_JSON" --key "$key" --output "$report" > /dev/null
        cat "$report" >> "$GITHUB_STEP_SUMMARY"
        echo "report=$report" >> "$GITHUB_OUTPUT"

    - name: Comment the comparison on the pull request
      if: >-
        always() && inputs.comment == 'true' && steps.compare.outputs.report != ''
        && github.actor != 'dependabot[bot]'
        && !github.event.pull_request.head.repo.fork
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        QG_REPO: ${{ github.repository }}
        QG_PR: ${{ github.event.pull_request.number }}
        QG_REPORT: ${{ steps.compare.outputs.report }}
      run: |
        # One comment per category: find it by the marker on its first line.
        marker="$(head -n 1 "$QG_REPORT")"
        id="$(gh api --paginate "repos/$QG_REPO/issues/$QG_PR/comments" \
          --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)"
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/$QG_REPO/issues/comments/$id" -F "body=@$QG_REPORT" > /dev/null
        else
          gh api -X POST "repos/$QG_REPO/issues/$QG_PR/comments" -F "body=@$QG_REPORT" > /dev/null
        fi

    - name: Fail when pytest failed
      if: always() && inputs.fail == 'true' && steps.pytest.outputs.exit-code != '0'
      shell: bash
      env:
        QG_CODE: ${{ steps.pytest.outputs.exit-code }}
      run: |
        echo "::error::pytest exited with code ${QG_CODE:-unknown}"
        exit 1
