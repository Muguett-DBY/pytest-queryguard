# The pages of the documentation site and their order; read by
# scripts/build_docs.py. Paths are relative to this directory.
title = "pytest-queryguard"
tagline = "N+1 detection and query budgets for SQLAlchemy 2 in pytest"
base_url = "https://maciejziel.github.io/pytest-queryguard/"
repo_url = "https://github.com/MaciejZiel/pytest-queryguard"
branch = "main"

[[section]]
title = "Start"
pages = [
  { title = "Overview", file = "index.md", description = "pytest-queryguard fails tests that run N+1 queries, enforces query budgets and finds missing indexes for SQLAlchemy 2, in sync, async and FastAPI code." },
  { title = "Getting started", file = "getting-started.md", description = "Install pytest-queryguard, see a first N+1 failure and its fix, and use it with async code and FastAPI." },
  { title = "A test failed: now what", file = "when-a-test-fails.md", description = "Read a pytest-queryguard failure, check that the finding is real, fix it, or leave it out on purpose." },
  { title = "How detection works", file = "how-detection-works.md", description = "The rules pytest-queryguard applies to find N+1 queries, repeated statements, column loads and write loops, and why the thresholds are what they are." },
]

[[section]]
title = "Adopting it"
pages = [
  { title = "CI and GitHub Action", file = "ci.md", description = "Run pytest-queryguard in CI and upload its findings to GitHub code scanning with the GitHub Action or a SARIF file." },
  { title = "Baseline", file = "baseline.md", description = "Record existing findings in a baseline file so that only new N+1 queries and missing indexes fail." },
  { title = "SARIF output", file = "sarif.md", description = "The SARIF 2.1.0 file pytest-queryguard writes for GitHub code scanning: fields, paths, fingerprints and upload rules." },
]

[[section]]
title = "Indexes"
pages = [
  { title = "Index check (PostgreSQL)", file = "index-check.md", description = "Fail tests whose SQL has no index to use, on PostgreSQL 16 and newer, by planning each SELECT without sequential scans." },
  { title = "Index check (SQLite)", file = "index-check-sqlite.md", description = "The missing-index check on SQLite: how EXPLAIN QUERY PLAN is used and where it judges less precisely." },
  { title = "Index check (MySQL and MariaDB)", file = "index-check-mysql.md", description = "Fail tests whose SQL has no index to use on MySQL and MariaDB, by reading EXPLAIN plans; tested in CI on MySQL 8.4 and MariaDB 11.8." },
  { title = "Index advisor", file = "index-advisor.md", description = "How the index advisor suggests CREATE INDEX statements and Alembic calls, and verifies them with hypopg." },
]

