[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pytest-queryguard"
dynamic = ["version"]
description = "Detect N+1 queries and enforce query budgets for SQLAlchemy 2 in pytest."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Maciej Zieliński" }]
keywords = [
    "pytest",
    "sqlalchemy",
    "n+1",
    "n-plus-one",
    "query-budget",
    "orm",
    "postgresql",
    "missing-index",
    "testing",
    "fastapi",
    "pytest-plugin",
    "query-count",
    "sqlite",
    "async",
    "sarif",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Plugins",
    "Framework :: FastAPI",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = ["pytest>=8", "sqlalchemy>=2.0.13"]

[project.urls]
Homepage = "https://github.com/MaciejZiel/pytest-queryguard"
Repository = "https://github.com/MaciejZiel/pytest-queryguard"
Documentation = "https://maciejziel.github.io/pytest-queryguard/"
Changelog = "https://github.com/MaciejZiel/pytest-queryguard/blob/main/CHANGELOG.md"
Issues = "https://github.com/MaciejZiel/pytest-queryguard/issues"

[project.entry-points.pytest11]
queryguard = "pytest_queryguard.plugin"

[dependency-groups]
dev = [
    # Async MySQL and MariaDB tests (MIT; PyMySQL, MIT). Not mysqlclient (GPL).
    "aiomysql>=0.3.2",
    "aiosqlite",
    # Async PostgreSQL tests (Apache-2.0; async-timeout, Apache-2.0, below 3.11).
    "asyncpg>=0.31",
    "coverage[toml]",
    "factory-boy>=3.3.3",
    "fastapi",
    "flask-sqlalchemy>=3.1.1",
    "httpx>=0.28,<0.29",
    "mypy",
    # PostgreSQL tests (BSD-3-Clause); psycopg and psycopg2 are LGPL, so not
    # here: CI installs psycopg for one run of the postgres job only.
    "pg8000>=1.31.5",
    # MySQL and MariaDB tests (MIT).
    "pymysql>=1.2.3",
    # tests/test_plugin_interplay.py: a timeout inside the plugin (MIT).
    "pytest-timeout>=2.3",
    # The multi-process tests in tests/test_xdist.py (MIT; execnet, MIT).
    "pytest-xdist>=3.5",
    "ruff",
    # SQLAlchemy 2.1 no longer installs greenlet, which the async tests need.
    "sqlalchemy[asyncio]",
]
# Builds the documentation site (scripts/build_docs.py): Markdown and Pygments, both BSD.
# Not installed with the package, and not part of the default groups' tests.
docs = [
    "markdown>=3.6",
    "pygments>=2.17",
]
# Third-party pytest plugins that change how every test runs, only for the
# tests the "plugins" CI job runs. Not in dev: installed, they would reorder or reconfigure the whole
# suite and the pytester sessions inside it. pytest-randomly (MIT),
# pytest-asyncio (Apache-2.0; backports-asyncio-runner, PSF-2.0, below 3.11).
plugins = [
    "pytest-asyncio>=0.24",
    "pytest-randomly>=3.15",
]

[tool.hatch.version]
path = "src/pytest_queryguard/__init__.py"

# An allowlist, so CI config, context7.json and any untracked local files stay
# out of the sdist. llms.txt is documentation and ships with it.
[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "tests",
    "docs",
    "3rdparty_licenses.md",
    "CHANGELOG.md",
    "LICENSE",
    "llms.txt",
    "README.md",
    "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_queryguard"]

[tool.uv]
exclude-newer = "2026-09-27T00:00:00Z"
# Security fixes published after the cutoff, one package at a time.
# werkzeug 3.1.9: GHSA-g6x2-hccm-hh4m (dev dependency, through flask).
# certifi 2026.10.18: drops the emSign roots (dev dependency, through httpx).
exclude-newer-package = { werkzeug = "2026-09-28T00:00:00Z", certifi = "2026-10-19T00:00:00Z" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest-timeout (dev group): a test that hangs fails after 10 minutes with
# the stack of every thread, instead of holding its CI job until GitHub
# cancels it with no trace of the test. The slowest test takes about two
# minutes on a CI runner. pytester projects have their own configuration and
# do not inherit this.
timeout = 600

[tool.ruff]
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends() in a default and the mutable __mapper_args__ dictionaries
# are how the code the corpus imitates is written.
"tests/corpus/**" = ["B008", "RUF012"]

[tool.mypy]
strict = true
files = ["src"]

[tool.coverage.run]
source = ["pytest_queryguard"]

[tool.coverage.report]
fail_under = 90
show_missing = true
